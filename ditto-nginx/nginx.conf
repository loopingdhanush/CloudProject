# Reverse proxy with basic authentication in front of the Ditto gateway.
# Login: ditto / ditto  (see nginx.htpasswd)
worker_processes auto;
events { worker_connections 1024; }

http {
  default_type application/json;
  server_tokens off;
  proxy_read_timeout 70;

  server {
    listen 80;

    location = / {
      default_type text/plain;
      return 200 "Eclipse Ditto for the Smart Library. REST API: /api/2/things  (user ditto / pass ditto)\n";
    }

    # Ditto REST API - basic auth, user is passed to Ditto as nginx:<user>
    location /api {
      include nginx-cors.conf;
      auth_basic           "Library digital twins";
      auth_basic_user_file nginx.htpasswd;

      proxy_pass         http://gateway:8080;
      proxy_http_version 1.1;
      proxy_set_header   Host $http_host;
      proxy_set_header   x-ditto-pre-authenticated "nginx:${remote_user}";
      proxy_set_header   Connection '';
      proxy_buffering    off;
    }

    # health of the Ditto cluster (no login)
    location /health {
      proxy_pass http://gateway:8080;
    }
  }
}
